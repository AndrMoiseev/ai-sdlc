[pytest]
addopts = --strict-markers -m "not installation"
markers =
    native_state: exercises state files, atomic replacement, locks, recovery or CLI reads
    native_process: exercises process startup, arguments, timeouts and exit handling
    native_git: exercises the real Git implementation and repository fixture contracts
    installation: checks source/installed entrypoints, dependency isolation and cache restoration
    network: downloads dependencies into an empty uv cache using the live package index
