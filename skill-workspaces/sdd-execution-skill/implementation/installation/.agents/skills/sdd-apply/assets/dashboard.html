<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDD execution · __CHANGE__</title>
<style>
:root{color-scheme:light dark;--bg:#101620;--panel:#1a2330;--ink:#edf3fa;--muted:#a9bbce;--line:#344356;--accent:#65d8b2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:44px 24px}header{border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{color:var(--accent);letter-spacing:.14em;font-size:12px}h1{font-size:clamp(26px,4vw,42px);margin:8px 0}h2{font-size:18px;margin:0 0 10px;overflow-wrap:anywhere}p{margin:8px 0}.muted{color:var(--muted)}#progress{font-size:22px;margin:22px 0}progress{width:100%;height:10px;accent-color:var(--accent)}#tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin:24px 0}article{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}a{color:var(--accent)}.badge{font-size:13px;text-transform:uppercase;color:var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,monospace}details{margin-top:12px}#blocked{color:#ffcba5}@media(prefers-color-scheme:light){:root{--bg:#f5f7fa;--panel:#fff;--ink:#192838;--muted:#55677b;--line:#d8e0e8;--accent:#08795b}#blocked{color:#934718}}
</style></head><body><main><header><div class="eyebrow">SPECIFICATION DRIVEN DEVELOPMENT</div><h1>__CHANGE__</h1><p id="meta" class="muted">Execution snapshot</p><p id="freshness" class="muted">Saved snapshot · __SAVED_AT__</p></header><p id="progress"></p><progress id="bar" max="1" value="0"></progress><p id="blocked"></p><section id="tasks">__STATIC_TASKS__</section><footer class="muted">State is authoritative. This view refreshes every two seconds. A copied HTML retains its saved snapshot.</footer></main>
<script>
(()=>{'use strict';let current=__SNAPSHOT__;const el=id=>document.getElementById(id);function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n;}
function draw(s,live){el('meta').textContent=s.mode+' · '+s.status+' · run '+s.run_id+' · revision '+s.revision;el('freshness').textContent=(live?'Live view':'Saved snapshot')+' · '+s.updated_at;el('progress').textContent=s.accepted+' / '+s.total+' tasks accepted';el('bar').max=Math.max(s.total,1);el('bar').value=s.accepted;el('blocked').textContent=s.blockers.map(b=>b.reason+(b.detail?': '+b.detail:'')).join(' · ');const fragment=document.createDocumentFragment();for(const t of s.tasks){const card=node('article','');card.append(node('h2',t.id),node('p',t.status,'badge'),node('p','Review '+t.review+' · Test repairs '+t.repair),node('p','Attempt '+t.attempt,'muted'));if(t.commits.length)card.append(node('pre',t.commits.join('\n')));if(t.blockers.length)card.append(node('pre',JSON.stringify(t.blockers,null,2)));const details=node('details','');details.append(node('summary','Criteria and evidence'));details.append(node('p',t.criteria.join(', ')));for(const e of t.evidence){const row=node('p',e.stage+' · '+e.outcome+' ');if(/^runs\/[a-zA-Z0-9_/-]+\.json$/.test(e.log)){const link=node('a','log');link.href=e.log;row.append(link);}details.append(row);}card.append(details);fragment.append(card);}el('tasks').replaceChildren(fragment);}
window.sddApplyUpdate=s=>{if(!s||s.schema_version!==1||s.change_id!==current.change_id||s.run_id!==current.run_id||!Number.isInteger(s.revision)||s.revision<current.revision)return;current=s;draw(s,true);};draw(current,false);
function poll(){const script=document.createElement('script');script.src='dashboard-state.js?t='+Date.now();script.onload=()=>script.remove();script.onerror=()=>{el('freshness').textContent='Saved snapshot · '+current.updated_at+' · live data unavailable';script.remove();};document.head.append(script);}setInterval(poll,2000);
})();
</script></body></html>
